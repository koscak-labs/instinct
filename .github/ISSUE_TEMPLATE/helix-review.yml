name: Helix review or reproduction
description: Review a database behavior, a Helix program, or an agent decision.
title: "[Helix] "
body:
  - type: textarea
    id: example
    attributes:
      label: Smallest example
      description: Paste a short Helix program, synthetic bank event, or anonymized task.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Expected and observed behavior
      description: Include the release, command, and the result someone else can check.
    validations:
      required: true
