<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lantern Studio pickup badges</title>
  <style>
    @page { size: A4 portrait; margin: 14mm; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #203d34; font-family: Arial, sans-serif; }
    main {
      display: grid;
      grid-template-columns: repeat(2, 86mm);
      gap: 6mm;
      justify-content: center;
    }
    article {
      height: 54mm;
      border: 0.3mm dashed #738479;
      padding: 7mm;
      display: grid;
      grid-template-rows: 1fr auto;
      text-align: center;
      break-inside: avoid;
    }
    .name {
      align-self: center;
      font: bold 32pt/1.1 Georgia, serif;
    }
    .seat {
      justify-self: center;
      padding: 2mm 4mm 0;
      border-top: 0.5mm solid #617e6b;
      font-size: 13pt;
      font-weight: bold;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <main>
    <article data-seat="V01">
      <span class="name">Lux</span>
      <span class="seat">V01</span>
    </article>
    <article data-seat="V03">
      <span class="name">Welcome</span>
      <span class="seat">V03</span>
    </article>
    <article data-seat="V04">
      <span class="name">Lux</span>
      <span class="seat">V04</span>
    </article>
  </main>
</body>
</html>
