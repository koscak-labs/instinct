<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lantern Studio pickup badges</title>
  <style>
    @page { size: A4 portrait; margin: 15mm; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #18382f;
      background: white;
    }
    main {
      display: grid;
      grid-template-columns: repeat(2, 85mm);
      gap: 8mm;
      justify-content: center;
    }
    article {
      height: 55mm;
      border: 0.3mm solid #758980;
      padding: 6mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4mm;
      break-inside: avoid;
    }
    .name {
      font: bold 29pt/1.1 Georgia, serif;
    }
    .seat {
      border-top: 0.5mm solid #567a69;
      padding: 3mm 5mm 0;
      font-size: 13pt;
      font-weight: 600;
      letter-spacing: 0.12em;
    }
    @media screen {
      body { padding: 15mm; }
    }
  </style>
</head>
<body>
  <main>
    <article data-seat="V01">
      <span class="name">Lux</span>
      <span class="seat">V01</span>
    </article>
    <article data-seat="V03">
      <span class="name">Welcome</span>
      <span class="seat">V03</span>
    </article>
    <article data-seat="V04">
      <span class="name">Lux</span>
      <span class="seat">V04</span>
    </article>
  </main>
</body>
</html>
