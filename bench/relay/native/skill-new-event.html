<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lantern Studio workshop pickup badges</title>
<style>
  @page { size: A4 portrait; margin: 16mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: #202724;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  main {
    display: grid;
    grid-template-columns: repeat(2, 85mm);
    gap: 7mm;
    justify-content: center;
  }
  article {
    height: 55mm;
    padding: 7mm;
    border: 0.25mm solid #777;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    break-inside: avoid;
  }
  .name {
    margin: 0;
    font-size: 28pt;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.035em;
  }
  .seat {
    border-top: 0.9mm solid #89691d;
    padding-top: 2mm;
    font: bold 14pt/1.2 "Courier New", monospace;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<main aria-label="Workshop pickup badges">
  <article data-seat="T02">
    <p class="name">Jules</p>
    <span class="seat">T02</span>
  </article>
  <article data-seat="T03">
    <p class="name">Ash</p>
    <span class="seat">T03</span>
  </article>
  <article data-seat="T04">
    <p class="name">Hello, friend</p>
    <span class="seat">T04</span>
  </article>
  <article data-seat="T05">
    <p class="name">Jules</p>
    <span class="seat">T05</span>
  </article>
</main>
</body>
</html>
